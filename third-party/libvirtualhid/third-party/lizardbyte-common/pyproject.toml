[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lizardbyte-common"
version = "0.0.0"
description = "Common helper scripts and repository tooling for LizardByte"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "LizardByte", email = "lizardbyte@users.noreply.github.com"},
]
dependencies = []

[project.scripts]
lb-localize = "scripts.localize:main"
lb-update-clang-format = "scripts.update_clang_format:main"

[project.optional-dependencies]
dev = [
    "lizardbyte-common[c]",
    "lizardbyte-common[lint-python]",
    "lizardbyte-common[test-python]",
]
c = [
    "lizardbyte-common[lint-c]",
    "lizardbyte-common[locale]",
    "lizardbyte-common[test-c]",
]
lint-c = [
    "clang-format==23.1.0",
    "cmakelang==0.6.13",
]
lint-python = [
    "flake8==7.3.0",
]
locale = [
    "babel==2.18.0",
]
test-c = [
    "gcovr==8.6",
]
test-python = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[dependency-groups]
dev = [
    {include-group = "c"},
    {include-group = "lint-python"},
    {include-group = "test-python"},
]
c = [
    {include-group = "lint-c"},
    {include-group = "locale"},
    {include-group = "test-c"},
]
lint-c = [
    "clang-format==23.1.0",
    "cmakelang==0.6.13",
]
lint-python = [
    "flake8==7.3.0",
]
locale = [
    "babel==2.18.0",
]
test-c = [
    "gcovr==8.6",
]
test-python = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.urls]
Homepage = "https://github.com/LizardByte/lizardbyte-common"
Repository = "https://github.com/LizardByte/lizardbyte-common"
Issues = "https://github.com/LizardByte/lizardbyte-common/issues"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-rxXs",
    "--tb=native",
    "--verbose",
    "--color=yes",
    "-p", "no:cacheprovider",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage/python-coverage.xml",
    "--cov-fail-under=100",
    "--junitxml=junit-python.xml",
    "-o", "junit_family=legacy",
]
markers = [
    "unit: Unit tests",
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
