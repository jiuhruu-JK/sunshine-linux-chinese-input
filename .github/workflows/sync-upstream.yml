name: Sync Upstream

# 每天拉上游 Sunshine 的最新 tag 并合并。
# 合并策略见 ci/sync-upstream.sh：
#   - 被升级的子模块自动重新收录；
#   - .github/workflows/ 保持删除（上游 CI 与本仓库无关）；
#   - 其它冲突（白名单文件）一律让流水线失败，交人工合并。

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LizardByte/Sunshine.git
          git fetch upstream --tags --force --prune

      - name: Select newest upstream tag
        id: select
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::没有找到上游 tag"
            exit 1
          fi
          echo "上游最新 tag：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync upstream
        run: ci/sync-upstream.sh "${{ steps.select.outputs.tag }}"

      - name: Boundary check
        run: ci/check-boundary.sh "${{ steps.select.outputs.tag }}"

      - name: Record upstream version
        run: |
          echo "${{ steps.select.outputs.tag }}" | sed 's/^v//' > upstream-version

      - name: Commit and push
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步上游 ${{ steps.select.outputs.tag }}"
          git push origin main
          # 标记「同步到了上游哪个版本」。
          # 刻意用 upstream/ 前缀：与上游同名的 tag 会盖住上游的同名 tag，
          # 之后 `git diff <tag>` 比的就不是上游的树了，边界门禁会形同虚设。
          git tag -f "upstream/${{ steps.select.outputs.tag }}"
          git push -f origin "upstream/${{ steps.select.outputs.tag }}"
